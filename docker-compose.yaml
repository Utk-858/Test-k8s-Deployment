version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sandbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandbox_user
      POSTGRES_PASSWORD: sandbox_password
      POSTGRES_DB: sandbox_db
    ports:
      - "15432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox_user -d sandbox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: sandbox-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: sandbox_user
      DB_PASSWORD: sandbox_password
      DB_NAME: sandbox_db
      DB_PORT: 5432

volumes:
  postgres_data:
